# FIFA World Cup 2026 prediction-pool scoring rules

active_rule: tournament_neutral_3_draw

tournament_neutral_3_draw:
  trend_win: 2       # Correct match outcome (winning team)
  diff_win: 3        # Correct goal difference
  exact_win: 4       # Correct exact scoreline
  trend_draw: 3      # Correct draw, incorrect scoreline
  exact_draw: 4      # Correct exact draw scoreline

bonus_scoring:
  points_per_correct: 4  # Points for each correct bonus answer
  order_matters: false   # Bonus-pick order does not matter

tiebreaker: most_exact_results
deadline_minutes_before: 0
