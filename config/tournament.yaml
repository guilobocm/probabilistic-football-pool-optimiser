# Copa do Mundo 2026 — Estrutura do Torneio
# 48 seleções, 12 grupos de 4, formato expandido

tournament:
  name: "FIFA World Cup 2026"
  host_countries: ["United States", "Mexico", "Canada"]
  start_date: "2026-06-11"
  end_date: "2026-07-19"
  neutral_venue: true  # Todos os jogos são considerados campo neutro

groups:
  A: ["Mexico", "South Africa", "South Korea", "Czechia"]
  B: ["Canada", "Bosnia and Herzegovina", "Qatar", "Switzerland"]
  C: ["Brazil", "Morocco", "Haiti", "Scotland"]
  D: ["United States", "Paraguay", "Australia", "Türkiye"]
  E: ["Germany", "Curaçao", "Ivory Coast", "Ecuador"]
  F: ["Netherlands", "Japan", "Sweden", "Tunisia"]
  G: ["Belgium", "Egypt", "Iran", "New Zealand"]
  H: ["Spain", "Cape Verde", "Saudi Arabia", "Uruguay"]
  I: ["France", "Senegal", "Iraq", "Norway"]
  J: ["Argentina", "Algeria", "Austria", "Jordan"]
  K: ["Portugal", "DR Congo", "Uzbekistan", "Colombia"]
  L: ["England", "Croatia", "Ghana", "Panama"]

# Regras de classificação na fase de grupos
group_stage:
  matches_per_team: 3
  advance_top: 2          # 1º e 2º de cada grupo avançam directamente
  advance_best_third: 8   # 8 melhores 3ºs colocados avançam
  total_advance: 32       # 24 (top2) + 8 (best 3rd) = 32

  # Critérios de desempate (em ordem)
  tiebreaker:
    - points              # 3 pts vitória, 1 empate, 0 derrota
    - goal_difference
    - goals_scored
    - head_to_head_points
    - head_to_head_goal_difference
    - head_to_head_goals_scored
    - fair_play           # cartões
    - drawing_of_lots

# Estrutura do mata-mata (Round of 32)
# Baseado no formato FIFA 2026
knockout:
  round_of_32:
    # Chave 1 (lado esquerdo)
    M49: ["1A", "3C/D/E"]
    M50: ["2C", "2D"]
    M51: ["1E", "3A/B/F"]
    M52: ["2A", "2B"]
    M53: ["1C", "3A/B/D"]
    M54: ["2E", "2F"]
    M55: ["1G", "3E/F/G"]
    M56: ["2I", "2J"]
    # Chave 2 (lado direito)
    M57: ["1B", "3C/D/F"]
    M58: ["2G", "2H"]
    M59: ["1D", "3B/E/F"]
    M60: ["2K", "2L"]
    M61: ["1F", "3A/D/E"]
    M62: ["2I", "2J"]  # Note: bracket TBD by FIFA
    M63: ["1H", "3G/H/I"]
    M64: ["2K", "2L"]

  # Etapas seguintes
  round_of_16: 8      # 8 jogos
  quarterfinals: 4    # 4 jogos
  semifinals: 2       # 2 jogos
  third_place: 1      # 1 jogo
  final: 1            # 1 jogo

