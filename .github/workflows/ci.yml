name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.29"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run Ruff lint
        run: uv run --frozen ruff check .

      - name: Run Ruff format check
        run: uv run --frozen ruff format --check .

      - name: Enforce public-language standard
        run: uv run --frozen python scripts/check_public_language.py

      - name: Verify public package manifest
        run: uv run --frozen python scripts/verify_public_package_manifest.py

      - name: Run tests
        run: uv run --frozen pytest

      - name: Run mypy
        run: uv run --frozen mypy src

      - name: Run synthetic demo
        run: uv run --frozen python -m examples.synthetic_four_team_tournament

      - name: Verify clean working tree
        run: git diff --exit-code
