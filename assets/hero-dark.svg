<svg width="100%" height="280" viewBox="0 0 1000 280" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="1000" height="280" fill="#09111F" rx="12"/>
    
    <!-- Decorative Grid / Pattern -->
    <g stroke="#8B949E" stroke-opacity="0.1" stroke-width="1">
        <line x1="0" y1="40" x2="1000" y2="40"/>
        <line x1="0" y1="240" x2="1000" y2="240"/>
    </g>

    <!-- Circular Chart (100,000 simulations) -->
    <g fill="none" stroke-width="12">
        <!-- Cyan arc (Top: 180 to 0 degrees) -->
        <path d="M 780,140 A 70,70 0 0,1 920,140" stroke="#30C7EC" />
        <!-- Green arc (Bottom Right: 0 to 90 degrees) -->
        <path d="M 920,140 A 70,70 0 0,1 850,210" stroke="#20C997" />
        <!-- Gold arc (Bottom Left: 90 to 180 degrees) -->
        <path d="M 850,210 A 70,70 0 0,1 780,140" stroke="#F5B942" />
    </g>
    
    <text x="850" y="135" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#F6F8FA" text-anchor="middle">100,000</text>
    <text x="850" y="160" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#8B949E" text-anchor="middle">simulations</text>

    <!-- Content -->
    <g font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
        <text x="50" y="80" font-size="14" font-weight="600" fill="#30C7EC" letter-spacing="2">DECISION SCIENCE × FOOTBALL</text>
        
        <text x="50" y="140" font-size="42" font-weight="800" fill="#F6F8FA">Probabilistic Football</text>
        <text x="50" y="185" font-size="42" font-weight="800" fill="#F6F8FA">Pool Optimiser</text>
        
        <text x="50" y="230" font-size="18" font-weight="400" fill="#8B949E">Optimising decisions, not merely predicting scores.</text>
        
        <!-- Tech Pills -->
        <g transform="translate(600, 215)">
            <rect x="0" y="0" width="100" height="24" rx="12" fill="#20C997"/>
            <text x="50" y="16" font-size="12" font-weight="600" fill="#F6F8FA" text-anchor="middle">Dixon–Coles</text>
            
            <rect x="110" y="0" width="115" height="24" rx="12" fill="#F5B942"/>
            <text x="167.5" y="16" font-size="12" font-weight="600" fill="#F6F8FA" text-anchor="middle">Expected Points</text>
            
            <rect x="235" y="0" width="95" height="24" rx="12" fill="#30C7EC"/>
            <text x="282.5" y="16" font-size="12" font-weight="600" fill="#F6F8FA" text-anchor="middle">Monte Carlo</text>
        </g>
    </g>
</svg>