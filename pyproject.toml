[project]
name = "probabilistic-football-pool-optimizer"
version = "1.1.0"
description = "A synthetic demonstration of a probabilistic football pool optimiser."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scipy",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "src.pipeline.run_all"
disable_error_code = ["assignment"]

[tool.pytest.ini_options]
pythonpath = [
  "."
]
